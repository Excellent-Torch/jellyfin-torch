services:
  jellyfin:
    image: jellyfin/jellyfin:latest
    container_name: jellyfin
    restart: unless-stopped
    mem_limit: 1536m
    env_file: .env
    user: "${PUID}:${PGID}"
    group_add:
      - "44"   # video
    ports:
      - "127.0.0.1:8096:8096"
    volumes:
      - ./data/jellyfin/config:/config
      - ./data/jellyfin/cache:/cache
      - /mnt/zurg:/media:ro
    environment:
      - JELLYFIN_PublishedServerUrl=${JELLYFIN_PUBLISHED_URL}
    networks:
      - media

  decypharr:
    image: cy01/blackhole:latest
    container_name: decypharr
    restart: unless-stopped
    mem_limit: 384m
    env_file: .env
    ports:
      - "127.0.0.1:8282:8282"
    volumes:
      - ./config/decypharr:/app
      - ./data/decypharr:/data
      - /mnt/zurg:/mnt/zurg:rw
    devices:
      - /dev/fuse:/dev/fuse:rwm
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    networks:
      - media
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8282/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s

  sonarr:
    image: lscr.io/linuxserver/sonarr:latest
    container_name: sonarr
    restart: unless-stopped
    mem_limit: 384m
    env_file: .env
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    ports:
      - "127.0.0.1:8989:8989"
    volumes:
      - ./config/sonarr:/config
      - /mnt/zurg:/data:ro
    networks:
      - media
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:8989/sonarr/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s

  radarr:
    image: lscr.io/linuxserver/radarr:latest
    container_name: radarr
    restart: unless-stopped
    mem_limit: 384m
    env_file: .env
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    ports:
      - "127.0.0.1:7878:7878"
    volumes:
      - ./config/radarr:/config
      - /mnt/zurg:/data:ro
    networks:
      - media
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:7878/radarr/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s

  prowlarr:
    image: lscr.io/linuxserver/prowlarr:latest
    container_name: prowlarr
    restart: unless-stopped
    mem_limit: 256m
    env_file: .env
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    ports:
      - "127.0.0.1:9696:9696"
    volumes:
      - ./config/prowlarr:/config
    networks:
      - media
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:9696/prowlarr/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s

  overseerr:
    image: lscr.io/linuxserver/overseerr:latest
    container_name: overseerr
    restart: unless-stopped
    mem_limit: 384m
    env_file: .env
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
    ports:
      - "127.0.0.1:5055:5055"
    volumes:
      - ./config/overseerr:/config
    networks:
      - media
    depends_on:
      - sonarr
      - radarr
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1:5055/overseerr/ || exit 1"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  media:
    driver: bridge
